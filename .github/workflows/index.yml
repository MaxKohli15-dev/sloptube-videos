name: Videoliste aktualisieren
on:
  push:
    branches: [main]
    paths-ignore: ['index.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-index.js
      - run: |
          git config user.name "sloptube-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet && exit 0
          git commit -m "index.json aktualisiert"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 3; node build-index.js; git add index.json; git commit --amend --no-edit || true; done
